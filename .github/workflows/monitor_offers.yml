name: Monitor public offers (observation only)
# PC éteint: scrape sources officielles, compare métier vs offers.json.
# Ne modifie JAMAIS offers.json ni les annonces plateforme.
# Commit uniquement si business/status/failure change (pas detected_at seul).
on:
  schedule:
    # 1×/jour (08:17 UTC) — observation-only; workflow_dispatch pour runs manuels
    - cron: "17 8 * * *"
  workflow_dispatch:
permissions:
  # Commit step needs to push its own observation-report commits (see
  # "Commit results" below). Missing entirely before 2026-08-18 -- every
  # run that detected a real business/status change failed at push with
  # "Permission ... denied to github-actions[bot] (403)" (3 consecutive
  # failures, 2026-08-16..18), silently losing that observation from git
  # even though it was captured correctly. No write to offers.json or any
  # platform ever happens here regardless of this permission.
  contents: write
concurrency:
  group: autofresh-monitor-offers
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
      - name: Rebuild registry + coverage
        env:
          AUTOFRESH_PHASE: "VALIDATION_LIVE"
          AUTOFRESH_LIVE_WRITES: "0"
        run: |
          python tools/build_offer_sources.py
          python monitor.py --coverage
          python monitor.py --priority
      - name: Run monitor (observation only)
        env:
          AUTOFRESH_PHASE: "VALIDATION_LIVE"
          AUTOFRESH_LIVE_WRITES: "0"
        run: |
          set +e
          python monitor.py --all
          RC=$?
          set -e
          echo "monitor_exit=$RC"
          python monitor.py --production-report || true
          python monitor.py --simulate-auto-accept || true
          python - <<'PY'
          from lib.monitor.auto_accept import auto_accept_enabled, observations_from_last_report, evaluate_all, apply_accepts
          if auto_accept_enabled():
              ev = evaluate_all(observations_from_last_report())
              print(apply_accepts(ev['accepts']))
          else:
              print('monitor_auto_accept=false — simulation only, no accepted-fields write')
          PY
          # never fail hard on single source 403 — report is enough
          exit 0
      - name: Upload report (always — history can live in artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-offers-report
          retention-days: 30
          path: |
            data/captures/monitor-last-report.json
            data/captures/monitor-auto-accept-simulation.json
            data/captures/offer-sources-verify.json
            data/monitor/
            data/offer-sources.json
          if-no-files-found: ignore
      - name: Commit only on business/status change
        if: success()
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          # should_commit is computed by save_run_report (compares to previous report)
          if python monitor.py --should-commit; then
            echo "Business/status change detected — committing light state"
            # Same class of bug fixed in capture_readonly.yml: `git add`
            # aborts the ENTIRE invocation (stages nothing at all) the
            # instant any one pathspec matches nothing. accepted-fields.json
            # / accepted-history.jsonl do not exist yet in this repo, so the
            # old single `git add ... 2>/dev/null || true` line silently
            # staged NOTHING on every run, including the paths that did
            # exist and did change. Add only what is actually present.
            for f in data/monitor/last-observations.json \
                     data/monitor/history.jsonl \
                     data/monitor/accepted-fields.json \
                     data/monitor/accepted-history.jsonl \
                     data/offer-sources.json \
                     data/captures/monitor-last-report.json \
                     data/captures/monitor-auto-accept-simulation.json; do
              if [ -f "$f" ]; then
                git add "$f"
              fi
            done
            if git diff --staged --quiet; then
              echo "no staged file changes"
            else
              git commit -m "chore(monitor): business/status observation update"
              # A failed pull/push must never be swallowed: the report this
              # run produced would otherwise claim a business/status change
              # was persisted when it was only ever committed locally on
              # this ephemeral runner. No retry loop -- one attempt, fail
              # loudly (visible red run) on error, same as
              # hermes_operator.yml / controlled_write.yml.
              if ! git pull --rebase origin "${{ github.ref_name }}"; then
                echo "::error::git pull --rebase failed -- monitor business/status commit was NOT pushed. The report this run produced does not reflect a durably persisted change."
                exit 1
              fi
              if ! git push; then
                echo "::error::git push failed -- monitor business/status commit was NOT pushed. The report this run produced does not reflect a durably persisted change."
                exit 1
              fi
            fi
          else
            echo "No business/status change — skip git commit (report stays in artifacts)"
            # still refresh last-observations locally in workspace but do not push noise
          fi

      - name: Upload notification outbox for Hermes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-monitor-offers
          retention-days: 7
          if-no-files-found: ignore
          path: data/notifications/
