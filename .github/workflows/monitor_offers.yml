name: Monitor public offers (observation only)
# PC éteint: scrape sources officielles, compare métier vs offers.json.
# Ne modifie JAMAIS offers.json ni les annonces plateforme.
on:
  schedule:
    # 2x/jour — suffisant pour offres de parrainage
    - cron: "17 7,19 * * *"
  workflow_dispatch:
concurrency:
  group: autofresh-monitor-offers
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
      - name: Run monitor (observation only)
        env:
          AUTOFRESH_PHASE: "VALIDATION_LIVE"
          AUTOFRESH_LIVE_WRITES: "0"
        run: |
          python tools/build_offer_sources.py
          python monitor.py --coverage
          # sequential, no aggressive retries (engine has none)
          set +e
          python monitor.py --all
          RC=$?
          set -e
          echo "monitor_exit=$RC"
          # never fail hard on single source 403 — report is enough
          exit 0
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-offers-report
          retention-days: 14
          path: |
            data/captures/monitor-last-report.json
            data/monitor/
            data/offer-sources.json
          if-no-files-found: ignore
      - name: Commit light history (no HTML)
        if: success()
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          git add data/monitor/last-observations.json data/monitor/history.jsonl data/offer-sources.json data/captures/monitor-last-report.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no commit"; else
            git commit -m "chore(monitor): observation-only offer scan"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || true
          fi
