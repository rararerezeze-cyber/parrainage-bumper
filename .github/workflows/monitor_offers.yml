name: Monitor public offers (observation only)
# PC éteint: scrape sources officielles, compare métier vs offers.json.
# Ne modifie JAMAIS offers.json ni les annonces plateforme.
# Commit uniquement si business/status/failure change (pas detected_at seul).
on:
  schedule:
    # 1×/jour (08:17 UTC) — observation-only; workflow_dispatch pour runs manuels
    - cron: "17 8 * * *"
  workflow_dispatch:
permissions:
  # Commit step needs to push its own observation-report commits (see
  # "Commit results" below). Missing entirely before 2026-08-18 -- every
  # run that detected a real business/status change failed at push with
  # "Permission ... denied to github-actions[bot] (403)" (3 consecutive
  # failures, 2026-08-16..18), silently losing that observation from git
  # even though it was captured correctly. No write to offers.json or any
  # platform ever happens here regardless of this permission.
  contents: write
concurrency:
  group: autofresh-monitor-offers
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Notification dedup state must survive across runners: data/notifications/
      # is gitignored, so every runner starts with an empty filesystem and the
      # per-event TTL (24 h for external blockers) would otherwise reset on every
      # single run — a 5-hourly cron would then report the same known blocker five
      # times a day. The rolling cache key restores the most recent state for THIS
      # workflow and writes a fresh entry each run.
      # Scope: per workflow, not global. Two different workflows keep independent
      # dedup state, and two concurrent runs of the same workflow can both restore
      # the same entry and both emit — the failure mode is one duplicate
      # notification, never a suppressed one. Fail-safe by design.
      # continue-on-error keeps the BEST_EFFORT/FAIL_OPEN contract: a cache miss,
      # a cache outage, or an empty path must never fail the business job.
      - name: Restore notification dedup state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            autofresh-notify-dedup-${{ github.workflow }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          if python -c "import json; raise SystemExit(0 if json.load(open('data/autofresh-phase.json', encoding='utf-8')).get('monitor_auto_accept') else 1)"; then
            playwright install --with-deps chromium
          else
            echo "batch_writer_browser_install_skipped=true"
          fi
      - name: Rebuild registry + coverage
        env:
          AUTOFRESH_PHASE: "PRODUCTION"
          AUTOFRESH_LIVE_WRITES: "0"
        run: |
          python tools/build_offer_sources.py
          python monitor.py --coverage
          python monitor.py --priority
      - name: Run monitor (observation only)
        env:
          AUTOFRESH_PHASE: "PRODUCTION"
          AUTOFRESH_LIVE_WRITES: "0"
        run: |
          set +e
          python monitor.py --all
          RC=$?
          set -e
          echo "monitor_exit=$RC"
          python monitor.py --production-report || true
          python monitor.py --simulate-auto-accept || true
          # never fail hard on single source 403 — report is enough
          exit 0

      - name: Apply verified batch and reconcile safe writers
        env:
          AUTOFRESH_PHASE: "PRODUCTION"
          AUTOFRESH_LIVE_WRITES: "1"
          ONEPARRAINAGE_EMAIL: ${{ secrets.ONEPARRAINAGE_EMAIL }}
          ONEPARRAINAGE_PASSWORD: ${{ secrets.ONEPARRAINAGE_PASSWORD }}
          CODE_PARRAINAGE_EMAIL: ${{ secrets.CODE_PARRAINAGE_EMAIL }}
          CODE_PARRAINAGE_PASSWORD: ${{ secrets.CODE_PARRAINAGE_PASSWORD }}
          PARRAINAGE_CO_EMAIL: ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD: ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE: ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lib.monitor.auto_accept import (
              apply_verified_batch,
              auto_accept_enabled,
              observations_from_last_report,
          )

          out = Path("data/captures/monitor-auto-accept-batch.json")
          if auto_accept_enabled():
              report = apply_verified_batch(
                  observations_from_last_report(),
                  run_writers=True,
              )
          else:
              report = {
                  "ok": True,
                  "applied": False,
                  "reason": "monitor_auto_accept_off",
                  "accepted_count": 0,
                  "verified_writes": 0,
                  "failed_writes": 0,
              }
          out.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "batch_accept "
              f"accepted={report.get('accepted_count', 0)} "
              f"verified_writes={report.get('verified_writes', 0)} "
              f"failed_writes={report.get('failed_writes', 0)}"
          )
          if not report.get("ok", False):
              raise SystemExit("verified batch reconciliation failed")
          PY
      - name: Upload report (always — history can live in artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-offers-report
          retention-days: 30
          path: |
            data/captures/monitor-last-report.json
            data/captures/monitor-auto-accept-simulation.json
            data/captures/monitor-auto-accept-batch.json
            data/captures/offer-sources-verify.json
            data/monitor/
            data/offer-sources.json
          if-no-files-found: ignore
      - name: Commit monitor state and verified batch baselines
        if: success()
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"

          # Observation snapshots are staged only on a business/status change,
          # preserving the no-noise monitor contract.
          if python monitor.py --should-commit; then
            echo "Business/status change detected — staging monitor state"
            for f in data/monitor/last-observations.json \
                     data/monitor/history.jsonl \
                     data/offer-sources.json \
                     data/captures/monitor-last-report.json \
                     data/captures/monitor-auto-accept-simulation.json; do
              [ -f "$f" ] && git add "$f"
            done
          else
            echo "No business/status observation change"
          fi

          # Batch acceptance/writer state is durable independently of whether
          # the observation signature changed on this exact run.
          for f in data/monitor/accepted-fields.json \
                   data/monitor/accepted-history.jsonl \
                   data/pending_writes.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d data/platform-mappings ] && git add data/platform-mappings/
          [ -d data/platform-golden ] && git add data/platform-golden/
          [ -d data/platform-templates ] && git add data/platform-templates/

          if git diff --staged --quiet; then
            echo "no staged file changes"
          else
            git commit -m "chore(autofresh): persist verified batch reconciliation"
            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              echo "::error::git pull --rebase failed -- batch reconciliation state was NOT pushed."
              exit 1
            fi
            if ! git push; then
              echo "::error::git push failed -- batch reconciliation state was NOT pushed."
              exit 1
            fi
          fi

      - name: Save notification dedup state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}

      - name: Deliver notifications to Slack
        if: always()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          AUTOFRESH_SLACK_CHANNEL: ${{ vars.AUTOFRESH_SLACK_CHANNEL }}
        run: python tools/notify_slack.py

      - name: Archive notification outbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-monitor-offers
          retention-days: 7
          if-no-files-found: ignore
          path: data/notifications/
