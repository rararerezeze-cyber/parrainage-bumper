name: Activation canary (platform writers, manual only)
# MANUAL ONLY — the two daily schedules were removed once Super-Parrain reached
# WRITE_VERIFIED + NORMAL_BUMP with the historical bumper authorized.
#
# Those schedules existed for exactly one reason: while Super-Parrain was
# CANARY_PENDING, this workflow was the sole live saver on that platform. That
# condition is over. FUSED_UPDATE_BUMP in bump_super_parrain.yml is now the single
# owner of the production cycle, and a scheduled canary here would only be able to
# re-enter a live-write path for a platform that no longer needs proving.
#
# The workflow is kept for its legitimate manual/diagnostic function on the other
# platforms (and status-only). A runtime guard below refuses a Super-Parrain
# canary outright when that platform is already WRITE_VERIFIED + NORMAL_BUMP, so
# an accidental dispatch cannot start a redundant canary either.
# Never bypasses Super-Parrain 24h cooldown.
# --force on controlled_write = operator intent confirmation only.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to canary"
        required: true
        default: "super-parrain"
        type: choice
        options:
          - super-parrain
          - parrainage-co
          - code-parrainage
          - 1parrainage
          - referralcodes
          - referralcode-tv
          - status-only
      program:
        description: "Canary program"
        required: true
        default: "kraken"
      execute:
        description: "Execute live write if eligible (true/false)"
        required: true
        default: "false"
permissions:
  contents: write
concurrency:
  # Shared with bump_super_parrain.yml — avoid race on last_super_run / live save
  group: parrainage-bumper-super
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Notification dedup state must survive across runners: data/notifications/
      # is gitignored, so every runner starts with an empty filesystem and the
      # per-event TTL (24 h for external blockers) would otherwise reset on every
      # single run — a 5-hourly cron would then report the same known blocker five
      # times a day. The rolling cache key restores the most recent state for THIS
      # workflow and writes a fresh entry each run.
      # Scope: per workflow, not global. Two different workflows keep independent
      # dedup state, and two concurrent runs of the same workflow can both restore
      # the same entry and both emit — the failure mode is one duplicate
      # notification, never a suppressed one. Fail-safe by design.
      # continue-on-error keeps the BEST_EFFORT/FAIL_OPEN contract: a cache miss,
      # a cache outage, or an empty path must never fail the business job.
      - name: Restore notification dedup state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            autofresh-notify-dedup-${{ github.workflow }}-
        # Minimal Super-Parrain canary runtime is on main (no feature checkout).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Resolve platform
        id: plat
        run: |
          P="${{ github.event.inputs.platform }}"
          E="${{ github.event.inputs.execute }}"
          PROG="${{ github.event.inputs.program }}"
          if [ -z "$P" ]; then P="super-parrain"; fi
          if [ -z "$E" ]; then E="true"; fi
          if [ -z "$PROG" ]; then PROG="kraken"; fi
          # scheduled runs: only super-parrain when eligible
          if [ "${{ github.event_name }}" = "schedule" ]; then
            P="super-parrain"
            E="true"
            PROG="kraken"
          fi
          echo "platform=$P" >> "$GITHUB_OUTPUT"
          echo "execute=$E" >> "$GITHUB_OUTPUT"
          echo "program=$PROG" >> "$GITHUB_OUTPUT"
      - name: Eligibility + plan (never force cooldown)
        env:
          SUPER_PARRAIN_EMAIL: ${{ secrets.SUPER_PARRAIN_EMAIL }}
          SUPER_PARRAIN_PASSWORD: ${{ secrets.SUPER_PARRAIN_PASSWORD }}
          PARRAINAGE_CO_EMAIL: ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD: ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE: ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          CODE_PARRAINAGE_EMAIL: ${{ secrets.CODE_PARRAINAGE_EMAIL }}
          CODE_PARRAINAGE_PASSWORD: ${{ secrets.CODE_PARRAINAGE_PASSWORD }}
          ONEPARRAINAGE_EMAIL: ${{ secrets.ONEPARRAINAGE_EMAIL }}
          ONEPARRAINAGE_PASSWORD: ${{ secrets.ONEPARRAINAGE_PASSWORD }}
          REFERRALCODES_EMAIL: ${{ secrets.REFERRALCODES_EMAIL }}
          REFERRALCODES_PASSWORD: ${{ secrets.REFERRALCODES_PASSWORD }}
          REFERRALCODE_EMAIL: ${{ secrets.REFERRALCODE_EMAIL }}
          REFERRALCODE_PASSWORD: ${{ secrets.REFERRALCODE_PASSWORD }}
        run: |
          set -e
          python tools/e2e_status.py || true
          P="${{ steps.plat.outputs.platform }}"
          PROG="${{ steps.plat.outputs.program }}"
          EXEC="${{ steps.plat.outputs.execute }}"
          echo "platform=$P program=$PROG execute=$EXEC"

          if [ "$P" = "status-only" ]; then
            python tools/e2e_status.py
            exit 0
          fi

          if [ "$P" = "super-parrain" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          from lib.super_parrain_schedule import (
              is_eligible,
              is_super_parrain_canary_pending,
              super_parrain_runtime_mode,
              decide_super_parrain_action,
          )
          from lib.write_status import is_write_verified
          e, nxt, h = is_eligible()
          pending = is_super_parrain_canary_pending()
          mode = super_parrain_runtime_mode()
          hist = decide_super_parrain_action()
          print(f"eligible={e} hours_remaining={h:.2f} next={nxt.isoformat()}")
          print(f"runtime_mode={mode} canary_pending={pending} write_verified={is_write_verified('super-parrain')}")
          print(f"historical_bumper_action={hist.get('action')} run_bump={hist.get('run_bump')}")
          # Proof: while canary pending, historical decide must never authorize bump
          if pending:
              assert hist.get("run_bump") is False, hist
              assert hist.get("action") == "skip", hist
              assert hist.get("activation_canary_owns_save") is True, hist
          open("/tmp/eligible","w").write("1" if e else "0")
          open("/tmp/next","w").write(nxt.isoformat())
          open("/tmp/canary_pending","w").write("1" if pending else "0")
          open("/tmp/runtime_mode","w").write(mode)
          Path("data/captures").mkdir(parents=True, exist_ok=True)
          Path("data/captures/activation-canary-gate.json").write_text(
              json.dumps({
                  "workflow": "activation_canary",
                  "runtime_mode": mode,
                  "canary_pending": pending,
                  "write_verified": is_write_verified("super-parrain"),
                  "eligible": e,
                  "next_eligible_at": nxt.isoformat(),
                  "hours_remaining": round(h, 2),
                  "historical_bumper": {
                      "action": hist.get("action"),
                      "run_bump": hist.get("run_bump"),
                      "skip_bump": hist.get("skip_bump"),
                      "activation_canary_owns_save": hist.get("activation_canary_owns_save"),
                  },
                  "sole_saver_while_pending": True,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            # dry plan always (real values from offers/operator)
            python tools/controlled_write_super_parrain.py --program "$PROG" --canary || true
            if [ "$EXEC" != "true" ]; then
              echo "execute=false — plan only"
              exit 0
            fi
            if [ "$(cat /tmp/eligible)" != "1" ]; then
              echo "WAIT: Super-Parrain cooldown until $(cat /tmp/next) — not forcing"
              python - <<'PY'
          import json
          from pathlib import Path
          from lib.super_parrain_schedule import is_eligible, super_parrain_runtime_mode
          e,nxt,h=is_eligible()
          Path("data/captures/activation-canary-result.json").write_text(json.dumps({
            "platform":"super-parrain","result":"WAIT","reason":"cooldown_24h",
            "runtime_mode": super_parrain_runtime_mode(),
            "next_eligible_at": nxt.isoformat(),"hours_remaining": round(h,2)
          },indent=2)+"\n",encoding="utf-8")
          PY
              exit 0
            fi
            # Sole live-save owner while CANARY_PENDING (or first verified write).
            # --force = operator intent only, does NOT bypass cooldown (checked above)
            set +e
            python tools/controlled_write_super_parrain.py --program "$PROG" --execute --force --canary
            RC=$?
            set -e
            echo "canary_exit=$RC"
            python tools/e2e_status.py || true
            python - <<'PY'
          import json
          from pathlib import Path
          from lib.write_status import is_write_verified, get_platform_status
          from lib.super_parrain_schedule import super_parrain_runtime_mode, decide_super_parrain_action
          verified = is_write_verified("super-parrain")
          mode = super_parrain_runtime_mode()
          hist = decide_super_parrain_action()
          meta = get_platform_status("super-parrain") if "get_platform_status" in dir() else {}
          try:
              from lib.write_status import load_write_status
              meta = (load_write_status().get("platforms") or {}).get("super-parrain") or {}
          except Exception:
              meta = {}
          out = {
              "platform": "super-parrain",
              "result": "WRITE_VERIFIED" if verified else "CANARY_ATTEMPTED",
              "runtime_mode": mode,
              "canary_pending": mode == "CANARY_PENDING",
              "post_match": (meta.get("evidence") or {}).get("post_match"),
              "historical_bumper_after": {
                  "action": hist.get("action"),
                  "run_bump": hist.get("run_bump"),
                  "runtime_mode": hist.get("runtime_mode"),
              },
          }
          Path("data/captures/activation-canary-result.json").write_text(
              json.dumps(out, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(out, indent=2, ensure_ascii=False))
          if verified:
              # WRITE_VERIFIED proves this one targeted canary; it does NOT by
              # itself authorize the separate global historical bumper (see
              # lib.super_parrain_schedule.is_historical_bumper_authorized).
              # Fail-closed default after a first WRITE_VERIFIED is SUSPENDED,
              # not NORMAL_BUMP.
              assert mode in ("NORMAL_BUMP", "WRITE_VERIFIED_BUMPER_SUSPENDED"), mode
              if mode == "NORMAL_BUMP":
                  print("CANARY_PENDING=false — historical bumper explicitly authorized (NORMAL_BUMP)")
              else:
                  print("CANARY_PENDING=false — content-writer WRITE_VERIFIED; historical bumper stays SUSPENDED (not authorized, fail-closed)")
          PY
            exit 0
          fi

          if [ "$P" = "referralcode-tv" ]; then
            python -c "from platforms.referralcode_tv.writer import dry_run_report; import json; print(json.dumps(dry_run_report('$PROG'),indent=2,ensure_ascii=False))"
            echo "ReferralCode.tv: plan only — do not re-login after last 30s timeout."
            python tools/probe_referralcode_tv_edit.py --public || true
            exit 0
          fi

          # Sequential gate: non-super live canary only after Super PASS + predecessor PASS
          if [ "$EXEC" = "true" ] && [ "$P" != "super-parrain" ]; then
            set +e
            python tools/activation_orchestrator.py gate --platform "$P"
            GATE=$?
            set -e
            if [ "$GATE" != "0" ]; then
              echo "WAIT: sequential gate refused $P (need Super sequence-cleared + predecessor cleared/blocked-skip)"
              python - <<PY
          import json
          from pathlib import Path
          from lib.canary_gate import may_execute_canary
          g = may_execute_canary("$P")
          Path("data/captures/activation-canary-result.json").write_text(
              json.dumps({"platform":"$P","result":"WAIT","gate":g}, indent=2)+"\n",
              encoding="utf-8",
          )
          PY
              exit 0
            fi
          fi

          case "$P" in
            parrainage-co) TOOL="tools/controlled_write_parrainage_co.py" ;;
            code-parrainage) TOOL="tools/controlled_write_code_parrainage.py" ;;
            1parrainage) TOOL="tools/controlled_write_1parrainage.py" ;;
            referralcodes) TOOL="tools/controlled_write_referralcodes.py" ;;
            *) TOOL="" ;;
          esac
          if [ -n "$TOOL" ] && [ -f "$TOOL" ]; then
            python "$TOOL" --program "$PROG" || true
            if [ "$EXEC" = "true" ]; then
              set +e
              python "$TOOL" --program "$PROG" --execute --force
              RC=$?
              set -e
              echo "canary_exit=$RC"
              python tools/e2e_status.py || true
            else
              echo "execute=false — plan only for $P"
            fi
            exit 0
          fi

          python - <<PY
          import json, importlib
          from pathlib import Path
          p = "${{ steps.plat.outputs.platform }}"
          prog = "${{ steps.plat.outputs.program }}"
          mods = {
            "parrainage-co": "platforms.parrainage_co.writer",
            "code-parrainage": "platforms.code_parrainage.writer",
            "1parrainage": "platforms.oneparrainage.writer",
          }
          m = mods.get(p)
          out = {"platform": p, "program": prog, "execute": False}
          if not m:
            out["error"] = "no_writer_module"
          else:
            try:
              mod = importlib.import_module(m)
              plan = mod.build_write_plan(p, prog, "fr")
              out["changed_fields"] = getattr(plan, "changed_fields", None)
              out["structure_preserved"] = getattr(plan, "structure_preserved", None)
              out["result"] = "PLAN_READY"
            except Exception as e:
              out["error"] = str(e)
              out["result"] = "PLAN_ERROR"
          Path("data/captures/activation-canary-result.json").write_text(
            json.dumps(out, ensure_ascii=False, indent=2)+"\n", encoding="utf-8"
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-canary-${{ steps.plat.outputs.platform }}
          path: |
            data/captures/
            data/platform-write-status.json
            data/autofresh-phase.json
            last_super_run.txt
            debug_*.png
          if-no-files-found: ignore
      - name: Commit status if verified
        if: success()
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          # Same class of bug fixed elsewhere this session (bump_super_parrain.yml,
          # monitor_offers.yml, capture_readonly.yml, hermes_operator.yml): a
          # grouped `git add` with `2>/dev/null || true` silently stages NOTHING
          # at all -- not even paths that exist and changed -- the instant one
          # pathspec matches nothing. And a masked pull/push (`|| true`) claims a
          # canary result was persisted when it never left this ephemeral runner.
          # Stage each individually behind an existence check, then fail loud.
          for p in data/platform-write-status.json \
                   data/autofresh-phase.json \
                   data/pending_writes.json \
                   data/super_parrain_jitter.json \
                   last_super_run.txt; do
            if [ -f "$p" ]; then
              git add "$p"
            fi
          done
          for d in data/captures data/platform-mappings data/platform-templates; do
            if [ -d "$d" ]; then
              git add "$d"
            fi
          done
          if git diff --cached --quiet; then
            echo "no commit"
          else
            git commit -m "chore(activation): canary result ${{ steps.plat.outputs.platform }}"
            BRANCH="${GITHUB_REF_NAME}"
            if ! git pull --rebase origin "$BRANCH"; then
              echo "::error::git pull --rebase failed -- activation canary result was NOT pushed."
              exit 1
            fi
            if ! git push origin "HEAD:$BRANCH"; then
              echo "::error::git push failed -- activation canary result was NOT pushed."
              exit 1
            fi
          fi

      - name: Save notification dedup state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}

      - name: Upload notification outbox for Hermes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-activation-canary
          retention-days: 7
          if-no-files-found: ignore
          path: data/notifications/
