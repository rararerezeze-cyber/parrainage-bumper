name: Preflight 1Parrainage final canary (read-only)
# Authenticated final gate: exact account/public baselines plus strict Save
# resolution. It never clicks Save, submits the edit form, or writes status.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: autofresh-preflight-1parrainage-headless
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Verify final preflight without Save
        env:
          AUTOFRESH_LIVE_WRITES: "0"
          ONEPARRAINAGE_EMAIL: ${{ secrets.ONEPARRAINAGE_EMAIL }}
          ONEPARRAINAGE_PASSWORD: ${{ secrets.ONEPARRAINAGE_PASSWORD }}
        run: |
          python -u tools/preflight_1parrainage_headless.py \
            --output diagnostic-artifacts/1parrainage-final-preflight.json
      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-1parrainage-headless
          retention-days: 14
          if-no-files-found: error
          path: diagnostic-artifacts/1parrainage-final-preflight.json
