name: Bump — Super Parrain (1x/jour)
# Cycle historique ~24h conserve. Autofresh = PRE-CHECK avant bumper, pas un remplacement.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | cycle | dry_precheck"
        required: false
        default: "auto"
concurrency:
  group: parrainage-bumper-super
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Decide slot (historical 24h)
        id: decide
        run: |
          set +e
          python tools/super_parrain_decide.py --json > /tmp/decision.json
          CODE=$?
          set -e
          cat /tmp/decision.json
          ACTION=$(python -c "import json;print(json.load(open('/tmp/decision.json'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=auto; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "dry_precheck" ]; then
            echo "action=dry" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "cycle" ]; then
            echo "action=cycle" >> "$GITHUB_OUTPUT"
          fi
      - name: Super-Parrain cycle (pre-check → update? → bump)
        env:
          SUPER_PARRAIN_EMAIL: ${{ secrets.SUPER_PARRAIN_EMAIL }}
          SUPER_PARRAIN_PASSWORD: ${{ secrets.SUPER_PARRAIN_PASSWORD }}
          TARGET_SITES: "super"
        run: |
          ACTION="${{ steps.decide.outputs.action }}"
          echo "action=$ACTION"
          if [ "$ACTION" = "wait" ]; then
            echo "Hors creneau 24h — skip (comportement bumper historique)"
            cat /tmp/decision.json
            exit 0
          fi
          if [ "$ACTION" = "dry" ]; then
            python tools/super_parrain_cycle.py --force-slot
            exit 0
          fi
          # cycle: PRE-CHECK + update si besoin + bumper.py inchange
          python tools/super_parrain_cycle.py --execute
      - name: Logs
        if: always()
        run: |
          cat bumper.log || true
          cat data/captures/super-parrain-last-cycle.json || true
          cat data/captures/write-super-parrain-kraken.json || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-parrain-cycle
          retention-days: 5
          if-no-files-found: ignore
          path: |
            data/captures/super-parrain-last-cycle.json
            data/captures/write-*.json
            data/pending_writes.json
            debug_super_write_*.png
            debug_super_write_form.json
            bumper.log
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_super_run.txt data/captures data/pending_writes.json \
            data/platform-mappings/super-parrain.*.json \
            data/platform-templates/super-parrain/ data/sync-state.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no commit"; else
            git commit -m "chore: super-parrain cycle results"
            git push
          fi
