name: Bump — Super Parrain (1x/jour)
# 1 Enregistrer / code promo = remontee (+ update Autofresh si diff). Pas de double passe.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | cycle | dry_precheck"
        required: false
        default: "auto"
concurrency:
  group: parrainage-bumper-super
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Decide 24h slot
        id: decide
        run: |
          set +e
          python tools/super_parrain_decide.py --json > /tmp/decision.json
          set -e
          cat /tmp/decision.json
          ACTION=$(python -c "import json;print(json.load(open('/tmp/decision.json'))['action'])")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=auto; fi
          if [ "$MODE" = "dry_precheck" ]; then echo "action=dry" >> "$GITHUB_OUTPUT"; fi
          if [ "$MODE" = "cycle" ]; then echo "action=cycle" >> "$GITHUB_OUTPUT"; fi
      - name: Super-Parrain fused cycle (canary Kraken)
        env:
          SUPER_PARRAIN_EMAIL: ${{ secrets.SUPER_PARRAIN_EMAIL }}
          SUPER_PARRAIN_PASSWORD: ${{ secrets.SUPER_PARRAIN_PASSWORD }}
          TARGET_SITES: "super"
          AUTOFRESH_SUPER: "1"
          # Premier live: Kraken content only; all other codes = BUMP_ONLY
          AUTOFRESH_MODE: "canary"
          AUTOFRESH_CANARY_PROGRAMS: "kraken"
          # VALIDATION_LIVE: Super-Parrain canary only (phase file also gates)
          AUTOFRESH_PHASE: "VALIDATION_LIVE"
          # Do NOT set AUTOFRESH_LIVE_WRITES=0 here — content canary allowed for enabled platform
        run: |
          ACTION="${{ steps.decide.outputs.action }}"
          echo "action=$ACTION"
          if [ "$ACTION" = "wait" ]; then
            echo "Hors creneau 24h — skip (bumper historique)"
            exit 0
          fi
          if [ "$ACTION" = "dry" ]; then
            python tools/super_parrain_cycle.py --force-slot
            exit 0
          fi
          # Une seule passe: bumper + prefill canary (Kraken) + 1 Enregistrer / code
          set +e
          python tools/super_parrain_cycle.py --execute
          RC=$?
          set -e
          echo "cycle_exit=$RC"
          # RC=2 = canary post_match false (bump ok, content fail) — ne casse pas le job bump
          if [ "$RC" -eq 2 ]; then
            echo "CANARY post_match=false — Autofresh content stopped; bump preserved"
            exit 0
          fi
          exit $RC
      - name: Logs
        if: always()
        run: |
          cat bumper.log || true
          cat data/captures/super-parrain-last-cycle.json || true
          python -c "
          import json, pathlib
          p=pathlib.Path('data/captures/super-parrain-last-cycle.json')
          if p.exists():
            d=json.loads(p.read_text())
            print('write_status=', d.get('write_status'))
            print('canary_verdict=', d.get('canary_verdict'))
          " || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-parrain-cycle
          retention-days: 5
          if-no-files-found: ignore
          path: |
            data/captures/super-parrain-last-cycle.json
            bumper.log
            debug_super_*.png
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_super_run.txt data/captures/super-parrain-last-cycle.json \
            data/platform-mappings/super-parrain.*.json \
            data/platform-templates/super-parrain/ 2>/dev/null || true
          if git diff --staged --quiet; then echo "no commit"; else
            git commit -m "chore: super-parrain fused canary cycle results"
            git push
          fi
