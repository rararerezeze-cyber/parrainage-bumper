name: Bump — Super Parrain (1x/jour)
# Historical bumper ~24h.
# Shared CANARY_PENDING gate with activation_canary.yml:
#   CANARY_PENDING (super-parrain != WRITE_VERIFIED)
#     → this workflow ALWAYS SKIP (no bump, no save, no last_super_run)
#     → activation_canary.yml is the only workflow allowed to live-save
#   After canary post_match=true → WRITE_VERIFIED → NORMAL_BUMP → cycle resumes
# Concurrency group MUST match activation_canary.yml (serialize races).
on:
  schedule:
    # Poll every 2h; while CANARY_PENDING the job decides skip and exits.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | cycle | dry_precheck"
        required: false
        default: "auto"
concurrency:
  group: parrainage-bumper-super
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # Runtime deps for CANARY_PENDING gate live on main (minimal schedule slice).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Light deps (decide only)
        run: pip install -r requirements.txt
      - name: Decide (+ CANARY_PENDING hard gate)
        id: decide
        run: |
          set -e
          python tools/super_parrain_decide.py --json | tee /tmp/decision.json
          ACTION=$(python -c "import json;print(json.load(open('/tmp/decision.json'))['action'])")
          MODE_RT=$(python -c "import json;print(json.load(open('/tmp/decision.json')).get('runtime_mode',''))")
          SKIP=$(python -c "import json;print(json.load(open('/tmp/decision.json')).get('skip_bump',True))")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "runtime_mode=$MODE_RT" >> "$GITHUB_OUTPUT"
          echo "skip_bump=$SKIP" >> "$GITHUB_OUTPUT"

          # Hard gate: never allow historical save while CANARY_PENDING
          if [ "$MODE_RT" = "CANARY_PENDING" ]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "CANARY_PENDING → historical bumper SKIP (activation_canary owns save)"
          fi

          # Visible alert (not just a buried JSON field): a WRITE_VERIFIED
          # platform sitting BUMPER_SUSPENDED means the ~24h historical
          # bump has stopped running until an operator explicitly calls
          # lib.super_parrain_schedule.authorize_historical_bumper() --
          # this can otherwise go unnoticed for days (real incident:
          # 2026-08-12 to 2026-08-16, discovered only when the operator
          # checked the live site). A GitHub Actions ::warning:: surfaces
          # in the run summary/annotations UI on every 2h poll while
          # suspended, with no extra alerting infra required.
          if [ "$MODE_RT" = "WRITE_VERIFIED_BUMPER_SUSPENDED" ]; then
            echo "::warning::Super-Parrain is WRITE_VERIFIED but the historical bumper is BUMPER_SUSPENDED (not explicitly authorized) -- the ~24h bump is NOT running. Call lib.super_parrain_schedule.authorize_historical_bumper() to resume it."
          fi

          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=auto; fi

          if [ "$MODE" = "dry_precheck" ]; then
            echo "action=dry" >> "$GITHUB_OUTPUT"
          fi

          # Manual "cycle" cannot force bump while CANARY_PENDING, nor while
          # WRITE_VERIFIED_BUMPER_SUSPENDED (WRITE_VERIFIED alone never
          # authorizes the global historical bumper — see
          # lib.super_parrain_schedule.is_historical_bumper_authorized).
          # decide_super_parrain_action()/super_parrain_cycle.py already
          # refuse this independently; this mirrors that at the earliest
          # point so a manual dispatch never even queues a browser install.
          if [ "$MODE" = "cycle" ]; then
            if [ "$MODE_RT" = "CANARY_PENDING" ] || [ "$MODE_RT" = "WRITE_VERIFIED_BUMPER_SUSPENDED" ]; then
              echo "action=skip" >> "$GITHUB_OUTPUT"
              echo "Forced cycle blocked by runtime_mode=$MODE_RT → SKIP (historical bumper not authorized)"
            else
              echo "action=cycle" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Super-Parrain action
        env:
          SUPER_PARRAIN_EMAIL: ${{ secrets.SUPER_PARRAIN_EMAIL }}
          SUPER_PARRAIN_PASSWORD: ${{ secrets.SUPER_PARRAIN_PASSWORD }}
          TARGET_SITES: "super"
          AUTOFRESH_SUPER: "1"
          AUTOFRESH_MODE: "canary"
          AUTOFRESH_CANARY_PROGRAMS: "kraken"
          AUTOFRESH_PHASE: "VALIDATION_LIVE"
        run: |
          set -e
          ACTION="${{ steps.decide.outputs.action }}"
          MODE_RT="${{ steps.decide.outputs.runtime_mode }}"
          echo "action=$ACTION runtime_mode=$MODE_RT skip_bump=${{ steps.decide.outputs.skip_bump }}"

          # Absolute: CANARY_PENDING never reaches bumper / controlled_write execute
          if [ "$MODE_RT" = "CANARY_PENDING" ] || [ "$ACTION" = "skip" ] || [ "$ACTION" = "wait" ]; then
            echo "=== SKIP historical bumper (no save, no last_super_run) ==="
            echo "Owner of next live save while CANARY_PENDING: activation_canary.yml"
            python -c "
          import json
          from lib.super_parrain_schedule import decide_super_parrain_action, is_eligible
          from pathlib import Path
          d = decide_super_parrain_action()
          e, nxt, h = is_eligible()
          out = {
            'workflow': 'bump_super_parrain',
            'result': 'SKIP',
            'reason': d.get('reason'),
            'runtime_mode': d.get('runtime_mode'),
            'canary_pending': d.get('canary_pending'),
            'run_bump': d.get('run_bump'),
            'skip_bump': d.get('skip_bump'),
            'activation_canary_owns_save': d.get('activation_canary_owns_save'),
            'eligible_now': e,
            'next_eligible_at': nxt.isoformat(),
            'hours_remaining': round(h, 2),
            'last_super_run': Path('last_super_run.txt').read_text(encoding='utf-8').strip()
              if Path('last_super_run.txt').exists() else None,
          }
          Path('data/captures').mkdir(parents=True, exist_ok=True)
          Path('data/captures/bump-super-parrain-gate.json').write_text(
            json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          assert out['run_bump'] is False
          assert out['skip_bump'] is True or out['runtime_mode'] == 'CANARY_PENDING' or out['result'] == 'SKIP'
          "
            exit 0
          fi

          if [ "$ACTION" = "dry" ]; then
            # Dry only — must not write last_super_run / no live save
            python tools/controlled_write_super_parrain.py --program kraken || true
            python tools/super_parrain_cycle.py --force-slot || true
            exit 0
          fi

          # WRITE_VERIFIED path only: fused cycle (precheck + bump)
          if [ "$ACTION" = "cycle" ]; then
            pip install -r requirements.txt
            playwright install --with-deps chromium
            set +e
            python tools/super_parrain_cycle.py --execute
            RC=$?
            set -e
            echo "cycle_exit=$RC"
            if [ "$RC" -eq 2 ]; then
              echo "post_match=false path — see cycle report"
              exit 0
            fi
            if [ "$RC" -eq 3 ]; then
              echo "cycle blocked (CANARY_PENDING fail-safe)"
              exit 0
            fi
            exit $RC
          fi

          echo "Unknown action=$ACTION — fail-safe skip"
          exit 0
      - name: Logs
        if: always()
        run: |
          cat data/captures/bump-super-parrain-gate.json || true
          cat bumper.log || true
          cat data/captures/super-parrain-last-cycle.json || true
          python -c "
          import json
          from lib.super_parrain_schedule import decide_super_parrain_action
          print('decision_now=', json.dumps(decide_super_parrain_action(), ensure_ascii=False))
          " || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-parrain-cycle
          retention-days: 5
          if-no-files-found: ignore
          path: |
            data/captures/bump-super-parrain-gate.json
            data/captures/super-parrain-last-cycle.json
            data/captures/write-super-parrain-kraken.json
            data/platform-write-status.json
            bumper.log
            debug_super_*.png
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Same class of bug fixed this session in capture_readonly.yml,
          # monitor_offers.yml, and hermes_operator.yml: `git add` aborts
          # the ENTIRE invocation (stages nothing at all, not even paths
          # that exist and changed) the instant one pathspec matches
          # nothing -- and an unmatched glob (e.g. super-parrain-last-
          # cycle.json / write-super-parrain-kraken.json, only written on
          # an actual cycle run, never on a skip) is exactly such a
          # pathspec. Stage each individually behind an existence check;
          # `data/platform-mappings/super-parrain.*.json` is a real shell
          # glob so it needs `compgen`/a loop rather than a plain `-f`.
          for p in data/captures/bump-super-parrain-gate.json \
                   data/captures/super-parrain-last-cycle.json \
                   data/captures/write-super-parrain-kraken.json \
                   data/platform-write-status.json \
                   data/autofresh-phase.json; do
            if [ -f "$p" ]; then
              git add "$p"
            fi
          done
          if [ -d data/platform-templates/super-parrain ]; then
            git add data/platform-templates/super-parrain/
          fi
          for f in data/platform-mappings/super-parrain.*.json; do
            [ -e "$f" ] && git add "$f"
          done
          # Never commit last_super_run from a CANARY_PENDING skip path
          if [ "${{ steps.decide.outputs.runtime_mode }}" != "CANARY_PENDING" ]; then
            if [ -f last_super_run.txt ]; then
              git add last_super_run.txt
            fi
          fi
          if git diff --staged --quiet; then
            echo "no commit"
          else
            git commit -m "chore: super-parrain canary/bump results"
            # A failed pull/push must never be swallowed: the artifacts this
            # run produced would otherwise claim results were persisted when
            # they only ever landed on this ephemeral runner's local disk.
            # No retry loop -- one attempt, fail loudly (visible red run).
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase failed -- super-parrain bump/canary results were NOT pushed. This run's results do not reflect a durably persisted change."
              exit 1
            fi
            if ! git push origin HEAD:main; then
              echo "::error::git push failed -- super-parrain bump/canary results were NOT pushed. This run's results do not reflect a durably persisted change."
              exit 1
            fi
          fi
