name: Bump — Code Parrainage & Parrainage.co (5x/jour)
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
concurrency:
  group: parrainage-bumper-autres
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 📦 Dépendances
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: 🚀 Bump Code Parrainage & Parrainage.co
        timeout-minutes: 20
        env:
          TWOCAPTCHA_KEY:            ${{ secrets.TWOCAPTCHA_KEY }}
          CODE_PARRAINAGE_EMAIL:     ${{ secrets.CODE_PARRAINAGE_EMAIL }}
          CODE_PARRAINAGE_PASSWORD:  ${{ secrets.CODE_PARRAINAGE_PASSWORD }}
          PARRAINAGE_CO_EMAIL:       ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD:    ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE:   ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          REFERRALCODE_EMAIL:        ${{ secrets.REFERRALCODE_EMAIL }}
          REFERRALCODE_PASSWORD:     ${{ secrets.REFERRALCODE_PASSWORD }}
          TARGET_SITES:              "code,parrainage,referralcode"
        run: |
          python bumper.py
      - name: 📋 Logs
        if: always()
        run: cat bumper.log || true
      - name: Upload debug captcha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-captcha
          retention-days: 3
          if-no-files-found: ignore
          path: |
            debug_bg.png
            debug_piece.png
            debug_parrainage_login.png
            debug_parrainage_avant.png
            debug_parrainage_apres.png
            debug_referralcode_login.png
