name: Bump — Code Parrainage & Parrainage.co (5x/jour)
# No schedule trigger here on purpose (2026-08-31): timing is owned by
# bump_autres_scheduler.yml, which dispatches this workflow at 5
# persisted, randomized times per UTC day (see
# lib/bump_autres_schedule.py) -- deliberately NOT a fixed cron, so this
# job never reads or writes that schedule and a manual/test dispatch here
# can never shift or redefine the planned slots.
on:
  workflow_dispatch:
    inputs:
      slot_id:
        description: "Scheduler idempotency key (period_date:index) -- set only by bump_autres_scheduler.yml. Leave empty for a manual/test dispatch, which always runs."
        required: false
        default: ""
concurrency:
  group: parrainage-bumper-autres
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Notification dedup state must survive across runners: data/notifications/
      # is gitignored, so every runner starts with an empty filesystem and the
      # per-event TTL (24 h for external blockers) would otherwise reset on every
      # single run — a 5-hourly cron would then report the same known blocker five
      # times a day. The rolling cache key restores the most recent state for THIS
      # workflow and writes a fresh entry each run.
      # Scope: per workflow, not global. Two different workflows keep independent
      # dedup state, and two concurrent runs of the same workflow can both restore
      # the same entry and both emit — the failure mode is one duplicate
      # notification, never a suppressed one. Fail-safe by design.
      # continue-on-error keeps the BEST_EFFORT/FAIL_OPEN contract: a cache miss,
      # a cache outage, or an empty path must never fail the business job.
      - name: Restore notification dedup state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            autofresh-notify-dedup-${{ github.workflow }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exactly-once slot check
        # Durable idempotency guard (2026-08-31): the scheduler's own
        # dispatch-then-commit sequence is not atomic -- a crash between a
        # successful GitHub API dispatch and the scheduler's own state
        # commit would otherwise let the next poll re-dispatch the same
        # logical slot. This is the real safety boundary: checked here,
        # before any dependency install or site access, keyed on a value
        # the scheduler derives purely from already-persisted data (never
        # a new timing decision) -- so a re-dispatch of a durably recorded slot cannot cause
        # a second real bump. A crash before persistence still needs review. Empty
        # slot_id (manual/test dispatch) always runs and never touches the
        # ledger.
        id: idempotency
        run: |
          set -e
          python - <<'PY'
          import os
          from lib.bump_autres_schedule import is_slot_already_processed
          from lib.bump_autres_schedule import LEDGER_PATH

          slot_id = os.environ.get("SLOT_ID", "").strip()
          if slot_id and not LEDGER_PATH.is_file():
              raise RuntimeError("Missing durable ledger; refusing site access")
          already = bool(slot_id) and is_slot_already_processed(slot_id)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'false' if already else 'true'}\n")
              fh.write(f"slot_id={slot_id}\n")
          if already:
              print(f"slot_id={slot_id!r} already processed -- skipping, no site access.")
          else:
              print(f"slot_id={slot_id!r} not yet processed (or manual dispatch) -- proceeding.")
          PY
        env:
          SLOT_ID: ${{ github.event.inputs.slot_id }}
      - name: 📦 Dépendances
        if: steps.idempotency.outputs.should_run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: 🚀 Bump Code Parrainage & Parrainage.co
        if: steps.idempotency.outputs.should_run == 'true'
        timeout-minutes: 20
        env:
          TWOCAPTCHA_KEY:            ${{ secrets.TWOCAPTCHA_KEY }}
          CODE_PARRAINAGE_EMAIL:     ${{ secrets.CODE_PARRAINAGE_EMAIL }}
          CODE_PARRAINAGE_PASSWORD:  ${{ secrets.CODE_PARRAINAGE_PASSWORD }}
          PARRAINAGE_CO_EMAIL:       ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD:    ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE:   ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          # ReferralCode.tv currently serves GitHub-hosted Chromium a real
          # Cloudflare Turnstile interstitial before login (read-only run
          # 32565187359). Do not retry or bypass it and do not let that external
          # blocker fail the healthy Code-Parrainage/Parrainage.co cycle.
          TARGET_SITES:              "code,parrainage"
        run: |
          python bumper.py
      - name: 📋 Logs
        if: always()
        run: cat bumper.log || true
      - name: Upload debug captcha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-captcha
          retention-days: 3
          if-no-files-found: ignore
          path: |
            debug_bg.png
            debug_piece.png
            debug_parrainage_login.png
            debug_parrainage_avant.png
            debug_parrainage_apres.png
            debug_referralcode_login.png

      - name: Record slot as processed (exactly-once ledger)
        # Only after a REAL, successful bump of a scheduler-originated
        # slot (should_run was true AND slot_id non-empty) -- a manual/
        # test dispatch (empty slot_id) never touches the ledger, and a
        # dispatch that was itself skipped as a duplicate must not
        # re-write an already-correct ledger entry.
        if: success() && steps.idempotency.outputs.should_run == 'true' && steps.idempotency.outputs.slot_id != ''
        run: |
          python tools/persist_bump_ledger.py
        env:
          SLOT_ID: ${{ steps.idempotency.outputs.slot_id }}

      - name: Save notification dedup state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}

      - name: Deliver notifications to Slack
        if: always()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          AUTOFRESH_SLACK_CHANNEL: ${{ vars.AUTOFRESH_SLACK_CHANNEL }}
        run: python tools/notify_slack.py

      - name: Archive notification outbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-bump-autres
          retention-days: 7
          if-no-files-found: ignore
          path: data/notifications/
