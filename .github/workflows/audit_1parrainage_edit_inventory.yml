name: Audit 1Parrainage full edit inventory (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-1parrainage-edit-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Read-only authenticated inventory
        env:
          ONEPARRAINAGE_EMAIL: ${{ secrets.ONEPARRAINAGE_EMAIL }}
          ONEPARRAINAGE_PASSWORD: ${{ secrets.ONEPARRAINAGE_PASSWORD }}
        run: python tools/audit_1parrainage_edit_inventory.py
      - name: Assert zero platform writes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("diagnostic-artifacts/1parrainage-edit-inventory.json")
          if not p.exists():
              raise SystemExit("inventory artifact missing")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("platform_writes") == 0
          PY
      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1parrainage-edit-inventory
          retention-days: 7
          if-no-files-found: error
          path: |
            diagnostic-artifacts/1parrainage-edit-inventory.json
            data/oneparrainage-edit-index.json
