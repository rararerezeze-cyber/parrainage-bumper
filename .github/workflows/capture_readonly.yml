name: Capture READ-ONLY (no bump)
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "parrainage,code,referralcode (tv only — NOT referralcodes.com). Prefer single site for focused runs."
        required: false
        default: "parrainage"
      mode:
        description: "capture | compare-kraken (read-only live vs OPERATOR_VALIDATED)"
        required: false
        default: "capture"
permissions:
  contents: write
concurrency:
  group: parrainage-capture-readonly
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Capture authenticated READ-ONLY
        env:
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
          CODE_PARRAINAGE_EMAIL: ${{ secrets.CODE_PARRAINAGE_EMAIL }}
          CODE_PARRAINAGE_PASSWORD: ${{ secrets.CODE_PARRAINAGE_PASSWORD }}
          PARRAINAGE_CO_EMAIL: ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD: ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE: ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          # ReferralCode.tv (NO S)
          REFERRALCODE_EMAIL: ${{ secrets.REFERRALCODE_EMAIL }}
          REFERRALCODE_PASSWORD: ${{ secrets.REFERRALCODE_PASSWORD }}
          # Available for future dedicated scripts — not mixed with tv
          REFERRALCODES_EMAIL: ${{ secrets.REFERRALCODES_EMAIL }}
          REFERRALCODES_PASSWORD: ${{ secrets.REFERRALCODES_PASSWORD }}
          ONEPARRAINAGE_EMAIL: ${{ secrets.ONEPARRAINAGE_EMAIL }}
          ONEPARRAINAGE_PASSWORD: ${{ secrets.ONEPARRAINAGE_PASSWORD }}
          AUTOFRESH_PHASE: "BASE"
          AUTOFRESH_LIVE_WRITES: "0"
        run: |
          SITES="${{ github.event.inputs.sites }}"
          if [ -z "$SITES" ]; then SITES=code; fi
          echo "sites=$SITES"
          # Presence only — never print secret values
          python - <<'PY'
          import os
          for k in ("PARRAINAGE_CO_EMAIL","PARRAINAGE_CO_PASSWORD","PARRAINAGE_CO_RM_COOKIE",
                    "TWOCAPTCHA_KEY",
                    "CODE_PARRAINAGE_EMAIL","REFERRALCODE_EMAIL","ONEPARRAINAGE_EMAIL","REFERRALCODES_EMAIL"):
              v=os.environ.get(k) or ""
              print(f"{k}: {'yes' if v else 'no'} len={len(v)}")
          PY
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=capture; fi
          if [ "$MODE" = "compare-kraken" ]; then
            PLATS="$SITES"
            if [ "$PLATS" = "parrainage" ] || [ -z "$PLATS" ]; then
              PLATS="parrainage-co,code-parrainage,1parrainage,referralcodes"
            fi
            python tools/compare_kraken_readonly.py --platforms "$PLATS"
            exit 0
          fi
          python tools/capture_auth_readonly.py --sites "$SITES"
          # Extra READ-ONLY edit probes (never save)
          if echo "$SITES" | grep -q parrainage; then
            python tools/probe_parrainage_co_pc_off.py || true
          fi
          if echo "$SITES" | grep -q referralcodes; then
            python tools/validate_referralcodes_agent_import.py || true
            python tools/inspect_referralcodes_commit_semantics.py || true
          fi
          if echo "$SITES" | grep -q referralcode && ! echo "$SITES" | grep -q referralcodes; then
            python tools/probe_referralcode_tv_edit.py --public --auth || true
          fi
          if echo "$SITES" | grep -q oneparrainage; then
            python tools/probe_1parrainage_edit.py --public --auth || true
          fi
      - name: Guard — no auth storage-state in workspace
        if: always()
        run: |
          # Never persist browser auth state (anti-leak + policy)
          if find . -type f \( -name 'storage-state*.json' -o -name '*cookies*.json' -o -path '*/.auth/*' \) 2>/dev/null | grep -q .; then
            echo "FORBIDDEN: auth storage-state/cookies found — refusing upload"
            find . -type f \( -name 'storage-state*.json' -o -name '*cookies*.json' -o -path '*/.auth/*' \) -print
            exit 1
          fi
          echo "OK: no storage-state artifacts"
      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-readonly
          retention-days: 7
          # Explicit: no storage-state, no cookies, no .auth
          path: |
            data/captures/
            data/platform-mappings/
            data/platform-templates/
            data/needs_canonical_data.json
            data/orphans/
            data/mapping-candidates.json
            debug_*.png
          if-no-files-found: ignore
      - name: Commit capture results on branch
        if: success()
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          # data/mapping-candidates.json: stage 1parrainage.kraken.fr.json
          # confirmed persist_conservative_mapping_update() divergence
          # tracking must survive across ephemeral runners, or every
          # candidate observation (Y) is lost the moment this job's runner
          # is torn down and the next capture starts from a blank slate.
          # Same conditional-commit gate as everything else in this step:
          # git diff --cached --quiet already guarantees no commit (no
          # noise) when the file's bytes are unchanged -- which is exactly
          # the case when no divergence was observed this run, since
          # lib.mapping_candidates.record_candidate_divergence() is then
          # never called and the file is never touched at all.
          git add data/platform-mappings data/platform-templates data/captures data/needs_canonical_data.json data/orphans data/mapping-candidates.json || true
          if git diff --cached --quiet; then
            echo "No capture files to commit"
          else
            git commit -m "chore(capture): AUTH READ-ONLY account capture artifacts"
            git pull --rebase origin "${GITHUB_REF_NAME}" || git pull --rebase origin HEAD
            git push
          fi
