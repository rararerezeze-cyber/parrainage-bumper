name: Capture READ-ONLY (no bump)
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "parrainage,code,referralcode (tv only — NOT referralcodes.com)"
        required: false
        default: "code,referralcode"
permissions:
  contents: write
concurrency:
  group: parrainage-capture-readonly
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Capture authenticated READ-ONLY
        env:
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
          CODE_PARRAINAGE_EMAIL: ${{ secrets.CODE_PARRAINAGE_EMAIL }}
          CODE_PARRAINAGE_PASSWORD: ${{ secrets.CODE_PARRAINAGE_PASSWORD }}
          PARRAINAGE_CO_EMAIL: ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD: ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE: ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          # ReferralCode.tv (NO S)
          REFERRALCODE_EMAIL: ${{ secrets.REFERRALCODE_EMAIL }}
          REFERRALCODE_PASSWORD: ${{ secrets.REFERRALCODE_PASSWORD }}
          # Available for future dedicated scripts — not mixed with tv
          REFERRALCODES_EMAIL: ${{ secrets.REFERRALCODES_EMAIL }}
          REFERRALCODES_PASSWORD: ${{ secrets.REFERRALCODES_PASSWORD }}
          ONEPARRAINAGE_EMAIL: ${{ secrets.ONEPARRAINAGE_EMAIL }}
          ONEPARRAINAGE_PASSWORD: ${{ secrets.ONEPARRAINAGE_PASSWORD }}
        run: |
          python tools/capture_auth_readonly.py --sites "${{ github.event.inputs.sites || 'code,referralcode' }}"
      - name: Public onboard refresh (no secrets used for passwords)
        run: |
          python tools/onboard_public.py --only referralcode-tv,referralcodes,1parrainage,referraldrop || true
      - name: Inventory + coverage
        run: |
          python tools/inventory_needs_canonical.py || true
          python sync.py --coverage || true
      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-readonly
          retention-days: 7
          path: |
            data/captures/
            data/platform-mappings/
            data/platform-templates/
            data/needs_canonical_data.json
            data/orphans/
            data/coverage-report.*
          if-no-files-found: ignore
      - name: Commit capture results on branch
        if: success()
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          git add data/platform-mappings data/platform-templates data/captures data/needs_canonical_data.json data/orphans data/coverage-report.json data/coverage-report.txt data/platform-profiles.json || true
          if git diff --cached --quiet; then
            echo "No capture files to commit"
          else
            git commit -m "chore(capture): READ-ONLY multi-site onboarding artifacts"
            git push
          fi
