name: Bump watchdog (missed-run catch-up)
# Detects a missed bump_autres.yml scheduled run (GitHub Actions schedule
# triggers are best-effort and can be delayed or silently dropped under
# load -- confirmed live 2026-08-31: two consecutive 5-hourly slots never
# fired) and dispatches a catch-up run. Read-only against the Actions API
# plus exactly one workflow_dispatch call -- never writes repo content,
# never touches bumper credentials directly.
on:
  schedule:
    - cron: "23 * * * *"  # hourly, off minute-0
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: parrainage-bumper-autres-watchdog
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore notification dedup state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            autofresh-notify-dedup-${{ github.workflow }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for a missed bump_autres.yml run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/bump_watchdog.py
      - name: Save notification dedup state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
      - name: Upload notification outbox for Hermes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-bump-watchdog
          retention-days: 7
          if-no-files-found: ignore
          path: data/notifications/
