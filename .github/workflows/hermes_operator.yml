name: Hermes operator (Autofresh backend)
# Primary product entry for Hermes (not BotFather).
# Hermes dispatches this workflow with a natural-language command and reads JSON artifact.
#
# Security:
# - Only callable via authenticated GitHub API (fine-grained PAT / GitHub App).
# - Optional AUTOFRESH_OPERATOR_TOKEN check inside hermes_autofresh when set.
# - No public webhook, no Autofresh-owned Telegram bot required.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Natural language operator command (e.g. Kraken gain filleul 20 €)"
        required: true
      requester:
        description: "Hermes identity string"
        required: false
        default: "hermes"
      correlation_id:
        description: "Optional correlation id for Hermes"
        required: false
        default: ""
      run_writers:
        description: "Run WRITE_VERIFIED writers (true/false). Fail-closed: only an explicit true arms a writer, and only for a 'set' command — status/plan/read commands never dispatch one either way."
        required: false
        default: "false"
      reply_channel:
        description: "Slack channel id to post the human-readable result to (optional; empty = no Slack post, e.g. legacy Hermes/Telegram dispatches). Generic — works identically for any channel, not tied to a specific one."
        required: false
        default: ""
      notification_test:
        description: "Send one labelled Slack transport test; only accepted with a read-only Kraken statut command and run_writers=false."
        required: false
        default: "false"
permissions:
  # Only what this job's own steps need. actions: write remains unused --
  # nothing in this job dispatches/cancels workflow runs. actions: read
  # (added 2026-08-31) is genuinely used: the "Autofresh bump" meta-command
  # (lib.autofresh_help.build_bump_status) reads bump_autres.yml's own run
  # history via the read-only Actions API to report last/next run status.
  contents: write
  actions: read
concurrency:
  group: autofresh-hermes-operator
  cancel-in-progress: false
jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Notification dedup state must survive across runners: data/notifications/
      # is gitignored, so every runner starts with an empty filesystem and the
      # per-event TTL (24 h for external blockers) would otherwise reset on every
      # single run — a 5-hourly cron would then report the same known blocker five
      # times a day. The rolling cache key restores the most recent state for THIS
      # workflow and writes a fresh entry each run.
      # Scope: per workflow, not global. Two different workflows keep independent
      # dedup state, and two concurrent runs of the same workflow can both restore
      # the same entry and both emit — the failure mode is one duplicate
      # notification, never a suppressed one. Fail-safe by design.
      # continue-on-error keeps the BEST_EFFORT/FAIL_OPEN contract: a cache miss,
      # a cache outage, or an empty path must never fail the business job.
      - name: Restore notification dedup state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            autofresh-notify-dedup-${{ github.workflow }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          python - <<'PY'
          from lib.write_status import summary
          s = summary()
          open("/tmp/need_browser","w").write("1" if s.get("write_verified_count") else "0")
          print("WRITE_VERIFIED", s.get("WRITE_VERIFIED"))
          PY
          if [ "$(cat /tmp/need_browser)" = "1" ]; then
            playwright install --with-deps chromium
          fi
      - name: Run Hermes Autofresh command
        id: run
        env:
          SUPER_PARRAIN_EMAIL: ${{ secrets.SUPER_PARRAIN_EMAIL }}
          SUPER_PARRAIN_PASSWORD: ${{ secrets.SUPER_PARRAIN_PASSWORD }}
          PARRAINAGE_CO_EMAIL: ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD: ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE: ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          AUTOFRESH_OPERATOR_TOKEN: ${{ secrets.AUTOFRESH_OPERATOR_TOKEN }}
          HERMES_SHARED_TOKEN: ${{ secrets.HERMES_SHARED_TOKEN }}
          # Read-only Actions API access for the "Autofresh bump" meta-command
          # (lib.autofresh_help.build_bump_status / lib.bump_watch) -- the
          # ambient per-job token, scoped by this workflow's own
          # `permissions: actions: read` above. Never used for anything else.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFRESH_PHASE: "VALIDATION_LIVE"
          GITHUB_ACTIONS: "true"
          # workflow_dispatch inputs passed ONLY via env -- never spliced into
          # the shell/Python source text below. GitHub Actions serializes an
          # env: value as a single opaque string into the process
          # environment; it is not textually interpolated into the script,
          # so quotes/triple-quotes/newlines/$/backticks/unicode in the
          # input can never break out of a string literal or be re-executed
          # by the shell. Do not change this back to `${{ github.event.inputs.* }}`
          # inline in `run:` -- see tests/test_hermes_operator_workflow.py.
          HERMES_INPUT_COMMAND: ${{ github.event.inputs.command }}
          HERMES_INPUT_REQUESTER: ${{ github.event.inputs.requester }}
          HERMES_INPUT_CORRELATION_ID: ${{ github.event.inputs.correlation_id }}
          HERMES_INPUT_RUN_WRITERS: ${{ github.event.inputs.run_writers }}
        run: |
          set -e
          python - <<'PY'
          import json, os
          from pathlib import Path

          # os.environ only -- no shell/YAML interpolation of user input past
          # this point. Quoted heredoc delimiter ('PY') also stops bash from
          # expanding any $(...) / `...` that might literally appear in the
          # command text before Python ever sees it.
          cmd = os.environ.get("HERMES_INPUT_COMMAND", "")
          requester = os.environ.get("HERMES_INPUT_REQUESTER") or "hermes"
          correlation_id = os.environ.get("HERMES_INPUT_CORRELATION_ID") or None
          run_writers_raw = os.environ.get("HERMES_INPUT_RUN_WRITERS") or "false"
          token = os.environ.get("AUTOFRESH_OPERATOR_TOKEN") or os.environ.get("HERMES_SHARED_TOKEN") or ""

          req = {
            "action": "autofresh",
            "command": cmd,
            "requester": {
              "source": "hermes",
              "identity": requester,
              "token": token,
            },
            "options": {
              "persist": True,
              "plan": True,
              # Fail-closed default "false" (see workflow_dispatch input).
              # Only ever consumed for a parsed action=="set" command anyway
              # (lib/hermes_interface.py) -- status/plan/read commands never
              # dispatch a writer regardless of this flag.
              "run_writers": run_writers_raw.strip().lower() == "true",
            },
            "correlation_id": correlation_id,
          }
          Path("/tmp/hermes-request.json").write_text(json.dumps(req, ensure_ascii=False), encoding="utf-8")

          # Never print the token, even redacted-by-GitHub-masking is not a
          # substitute for not logging it in the first place.
          safe = json.loads(json.dumps(req))
          safe["requester"]["token"] = "***" if safe["requester"].get("token") else ""
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          PY
          set +e
          python tools/hermes_autofresh.py --request-file /tmp/hermes-request.json > /tmp/hermes-result.json
          RC=$?
          set -e
          echo "hermes_exit=$RC"
          # Always keep structured result
          cp /tmp/hermes-result.json data/captures/hermes-last-result.json 2>/dev/null || true
          python -c "import json; d=json.load(open('/tmp/hermes-result.json',encoding='utf-8')); print('ok=',d.get('ok'),'errors=',d.get('errors')); print('WRITE_VERIFIED', (d.get('write_status') or {}).get('WRITE_VERIFIED'))"
          # Non-zero only for hard failures; parse/auth still upload artifact
          exit 0
      - name: Upload Hermes JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-autofresh-result
          retention-days: 30
          path: |
            data/captures/hermes-last-result.json
            data/captures/verified-writers-report.json
            data/operator-overrides.json
            data/platform-write-status.json
            /tmp/hermes-result.json
          if-no-files-found: ignore
      - name: Commit overrides + status
        if: success()
        run: |
          set -e
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          # Same class of bug fixed in capture_readonly.yml and
          # monitor_offers.yml this session: `git add` aborts the ENTIRE
          # invocation (stages nothing at all, not even the paths that do
          # exist and did change) the instant one pathspec matches nothing.
          # Every path below is currently a git-tracked baseline file/dir
          # (verified), so the old grouped `2>/dev/null || true` line was
          # not live-broken -- but it is the exact same fragile pattern,
          # one rename/deletion away from silently staging nothing on
          # every Hermes run ever after. Stage each individually instead.
          for p in data/operator-overrides.json \
                   data/platform-write-status.json \
                   data/captures \
                   data/circuit-breakers.json \
                   data/pending_writes.json \
                   data/platform-mappings \
                   data/platform-templates \
                   data/snapshots \
                   data/sync-state.json \
                   last_super_run.txt \
                   data/autofresh-phase.json \
                   data/super_parrain_jitter.json; do
            if [ -e "$p" ]; then
              git add "$p"
            fi
          done
          # Hermes set/remove commands create a durable pre-mutation snapshot.
          # A writer failure may also open a durable circuit breaker. Keep both
          # in the evidence commit. The append-only audit line is runner-only:
          # it must not make pull --rebase fail, but no other residual path is
          # accepted.
          mapfile -t UNSTAGED < <(git diff --name-only)
          mapfile -t UNTRACKED < <(git ls-files --others --exclude-standard)
          python tools/check_hermes_evidence_paths.py \
            --unstaged "${UNSTAGED[@]}" \
            --untracked "${UNTRACKED[@]}"
          if printf '%s\n' "${UNSTAGED[@]}" | grep -Fxq "data/audit/events.jsonl"; then
            git stash push -m "runner-only Hermes audit" -- data/audit/events.jsonl
          fi
          if git diff --cached --quiet; then
            echo "no commit"
            exit 0
          fi
          git commit -m "chore(hermes): operator command result"
          # No auto-retry loop (avoid a retry storm on repeated failures) --
          # one pull+push attempt. A failure here must NOT be swallowed: the
          # already-uploaded hermes-last-result.json artifact/JSON reflects
          # a mutation that only ever landed on this ephemeral runner's
          # local disk, never durably in the repo, unless this step's own
          # exit code is 0. Let a failure here fail the job (visible red run)
          # instead of `|| true`-ing past it.
          if ! git pull --rebase origin "${{ github.ref_name }}"; then
            echo "::error::git pull --rebase failed -- Hermes operator commit was NOT pushed. The result JSON this run produced does not reflect a durably persisted change."
            exit 1
          fi
          if ! git push; then
            echo "::error::git push failed -- Hermes operator commit was NOT pushed. The result JSON this run produced does not reflect a durably persisted change."
            exit 1
          fi
          echo "git_persisted=true"

      - name: Save notification dedup state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}

      - name: Deliver notifications to Slack
        if: always()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          AUTOFRESH_SLACK_CHANNEL: ${{ vars.AUTOFRESH_SLACK_CHANNEL }}
        run: python tools/notify_slack.py

      - name: Archive notification outbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-hermes-operator
          retention-days: 7
          if-no-files-found: ignore
          path: data/notifications/
      - name: Test Slack notification transport
        if: success() && github.event.inputs.notification_test == 'true' && github.event.inputs.run_writers == 'false' && github.event.inputs.command == 'Kraken statut'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          AUTOFRESH_SLACK_CHANNEL: ${{ vars.AUTOFRESH_SLACK_CHANNEL }}
        run: python tools/notify_slack.py --test

      - name: Post Slack reply
        # Generic, centralized: one step, driven by the reply_channel input.
        # No per-channel special-casing -- works identically for #hermes,
        # #betstats, #bonusparrain or any future channel the caller passes.
        # Legacy Hermes/Telegram dispatches simply leave reply_channel empty
        # and this step is a no-op; nothing about their behavior changes.
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          REPLY_CHANNEL: ${{ github.event.inputs.reply_channel }}
          HERMES_INPUT_RUN_WRITERS: ${{ github.event.inputs.run_writers }}
        run: |
          if [ -z "$REPLY_CHANNEL" ]; then
            echo "reply_channel not set -- skipping Slack reply"
            exit 0
          fi
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::warning::reply_channel set but SLACK_BOT_TOKEN secret missing -- cannot post Slack reply"
            exit 0
          fi
          if [ ! -f /tmp/hermes-result.json ]; then
            echo "::warning::no /tmp/hermes-result.json -- nothing to post to Slack"
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request

          from lib.slack_format import render_result, guard_workflow_result

          with open("/tmp/hermes-result.json", encoding="utf-8") as fh:
              result = json.load(fh)
          run_writers_requested = os.environ.get("HERMES_INPUT_RUN_WRITERS", "false").strip().lower() == "true"
          result = guard_workflow_result(result, os.environ.get("JOB_STATUS", "unknown"))
          payload = render_result(result, run_writers_requested=run_writers_requested)
          payload["channel"] = os.environ["REPLY_CHANNEL"]

          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  body = json.loads(resp.read().decode("utf-8"))
          except Exception as exc:  # noqa: BLE001
              print(f"::warning::Slack post failed: {exc}")
          else:
              if not body.get("ok"):
                  print(f"::warning::Slack API rejected message: {body.get('error')}")
              else:
                  print("slack_posted=true")
          PY
