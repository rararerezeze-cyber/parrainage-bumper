name: AutoFresh scheduler watchdog

on:
  schedule:
    # Cloudflare is the primary 15-minute wake-up source. This lightweight
    # fallback runs every 30 minutes and dispatches only when Cloudflare has
    # been silent for more than 25 minutes.
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: autofresh-scheduler-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore notification dedup state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            autofresh-notify-dedup-${{ github.workflow }}-

      - name: Check latest Cloudflare scheduler wake-up
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_created="$(
            gh api "repos/$REPO/actions/workflows/bump_autres_scheduler.yml/runs?per_page=1"               --jq '.workflow_runs[0].created_at // ""'
          )"

          should_dispatch="$(
            LATEST_CREATED="$latest_created" python - <<'PY'
          import os
          from datetime import datetime, timezone

          raw = os.environ.get("LATEST_CREATED", "").strip()
          if not raw:
              print("1")
              raise SystemExit

          latest = datetime.fromisoformat(raw.replace("Z", "+00:00"))
          age = (datetime.now(timezone.utc) - latest).total_seconds()
          print("1" if age > 25 * 60 else "0")
          PY
          )"

          echo "latest_created=$latest_created"
          echo "should_dispatch=$should_dispatch"
          echo "dispatch=$should_dispatch" >> "$GITHUB_OUTPUT"

      - name: Dispatch scheduler fallback
        if: steps.check.outputs.dispatch == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST             "repos/$REPO/actions/workflows/bump_autres_scheduler.yml/dispatches"             -f ref=main
          echo "::warning::Cloudflare scheduler wake-up was stale; dispatched one GitHub fallback wake-up."

      - name: Save notification dedup state
        if: always() && hashFiles('data/notifications/dedup.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}

      - name: Export notification outbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-scheduler-watchdog
          retention-days: 2
          if-no-files-found: ignore
          path: data/notifications/
