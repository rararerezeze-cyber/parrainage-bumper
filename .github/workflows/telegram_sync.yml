name: Telegram sync (legacy / optional)
# LEGACY entry. Product path for Hermes: hermes_operator.yml + tools/hermes_autofresh.py
# Autofresh does NOT own a Telegram bot; Hermes does.
# This workflow remains for manual GH dispatch / optional test worker.
# FULL OPERATOR CONTROL: override → plan → live only if WRITE_VERIFIED.
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Natural language operator command"
        required: true
      chat_id:
        description: "Optional Telegram chat id (legacy direct notify; prefer Hermes)"
        required: false
        default: ""
      requester:
        description: "Caller identity (hermes / manual)"
        required: false
        default: "manual"
permissions:
  contents: write
  actions: write
concurrency:
  group: autofresh-telegram-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          # Playwright only if a WRITE_VERIFIED platform needs browser (lazy)
          python - <<'PY'
          from lib.write_status import summary
          s = summary()
          print("WRITE_VERIFIED", s.get("WRITE_VERIFIED"), s.get("telegram_live_capable"))
          open("/tmp/need_browser", "w").write("1" if s.get("write_verified_count") else "0")
          PY
          if [ "$(cat /tmp/need_browser)" = "1" ]; then
            playwright install --with-deps chromium
          fi
      - name: Apply operator control (Hermes-compatible JSON + human report)
        id: apply
        env:
          SUPER_PARRAIN_EMAIL: ${{ secrets.SUPER_PARRAIN_EMAIL }}
          SUPER_PARRAIN_PASSWORD: ${{ secrets.SUPER_PARRAIN_PASSWORD }}
          PARRAINAGE_CO_EMAIL: ${{ secrets.PARRAINAGE_CO_EMAIL }}
          PARRAINAGE_CO_PASSWORD: ${{ secrets.PARRAINAGE_CO_PASSWORD }}
          PARRAINAGE_CO_RM_COOKIE: ${{ secrets.PARRAINAGE_CO_RM_COOKIE }}
          AUTOFRESH_OPERATOR_TOKEN: ${{ secrets.AUTOFRESH_OPERATOR_TOKEN }}
          HERMES_SHARED_TOKEN: ${{ secrets.HERMES_SHARED_TOKEN }}
          AUTOFRESH_PHASE: "VALIDATION_LIVE"
          GITHUB_ACTIONS: "true"
        run: |
          set -e
          MSG='${{ github.event.inputs.message }}'
          python tools/e2e_status.py || true
          # Structured JSON for Hermes (primary)
          REQ="${{ github.event.inputs.requester }}"
          if [ -z "$REQ" ]; then REQ="manual"; fi
          python tools/hermes_autofresh.py \
            --command "$MSG" \
            --requester-source "$REQ" \
            --requester-identity "$REQ" \
            > /tmp/hermes-result.json || true
          cp /tmp/hermes-result.json data/captures/hermes-last-result.json 2>/dev/null || true
          # Human-readable report (legacy)
          python tools/telegram_update.py "$MSG" --write | tee /tmp/tg-report.txt || true
          {
            echo "=== AUTOFRESH OPERATOR (via Hermes interface) ==="
            echo "Note: Hermes owns Telegram. This workflow is backend-only."
            cat /tmp/tg-report.txt 2>/dev/null || true
            echo ""
            echo "=== JSON (machine) ==="
            head -c 3000 /tmp/hermes-result.json 2>/dev/null || true
            echo ""
            echo "Monitor: OBSERVATION_ONLY (no auto-accept)"
          } | tee /tmp/final-report.txt
      - name: Notify Telegram
        if: always() && github.event.inputs.chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN secret missing — skip notify"
            exit 0
          fi
          python - <<'PY'
          import os, json, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ.get("CHAT_ID") or ""
          if not chat:
              print("no chat_id"); raise SystemExit(0)
          text = open("/tmp/final-report.txt", encoding="utf-8", errors="replace").read()[:3500]
          if not text.strip():
              text = "Autofresh sync done (empty report)."
          data = json.dumps({"chat_id": chat, "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("telegram notified", resp.status)
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-sync-report
          retention-days: 14
          path: |
            data/captures/hermes-last-result.json
            data/captures/telegram-last-report.txt
            data/captures/verified-writers-report.json
            data/captures/e2e-status.json
            data/operator-overrides.json
            data/platform-write-status.json
            /tmp/hermes-result.json
          if-no-files-found: ignore
      - name: Commit overrides + status
        if: success()
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          git add data/operator-overrides.json data/platform-write-status.json data/offers.json data/captures data/pending_writes.json data/platform-mappings data/platform-templates data/sync-state.json last_super_run.txt data/autofresh-phase.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no commit"; else
            git commit -m "chore(telegram): operator override / e2e plan"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || true
          fi
