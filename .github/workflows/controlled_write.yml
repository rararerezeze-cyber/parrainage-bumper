name: Controlled write (Super-Parrain)
# Developpe et versionne sur la branche Autofresh uniquement.
# Ne pas merger dans main tant que le write n'est pas valide.
on:
  workflow_dispatch:
    inputs:
      program:
        description: "Programme (ex. kraken)"
        required: true
        default: "kraken"
      execute:
        description: "true = publication reelle; false = plan/diff only"
        required: true
        default: "false"
      only_fields:
        description: "Champs mutables a changer (ex. referee_reward). Vide = tous."
        required: false
        default: ""
      override:
        description: "FIELD=VALUE render override (ex. referee_reward=3 €)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: autofresh-controlled-write
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Notification dedup state must survive across runners: data/notifications/
      # is gitignored, so every runner starts with an empty filesystem and the
      # per-event TTL (24 h for external blockers) would otherwise reset on every
      # single run — a 5-hourly cron would then report the same known blocker five
      # times a day. The rolling cache key restores the most recent state for THIS
      # workflow and writes a fresh entry each run.
      # Scope: per workflow, not global. Two different workflows keep independent
      # dedup state, and two concurrent runs of the same workflow can both restore
      # the same entry and both emit — the failure mode is one duplicate
      # notification, never a suppressed one. Fail-safe by design.
      # continue-on-error keeps the BEST_EFFORT/FAIL_OPEN contract: a cache miss,
      # a cache outage, or an empty path must never fail the business job.
      - name: Restore notification dedup state
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            autofresh-notify-dedup-${{ github.workflow }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Plan / Write Super-Parrain
        env:
          SUPER_PARRAIN_EMAIL: ${{ secrets.SUPER_PARRAIN_EMAIL }}
          SUPER_PARRAIN_PASSWORD: ${{ secrets.SUPER_PARRAIN_PASSWORD }}
        run: |
          ARGS=(--program "${{ github.event.inputs.program }}")
          ONLY="${{ github.event.inputs.only_fields }}"
          OV="${{ github.event.inputs.override }}"
          if [ -n "$ONLY" ]; then ARGS+=(--only-fields "$ONLY"); fi
          if [ -n "$OV" ]; then ARGS+=(--override "$OV"); fi
          if [ "${{ github.event.inputs.execute }}" = "true" ]; then
            ARGS+=(--execute --force)
          fi
          python -u tools/controlled_write_super_parrain.py "${ARGS[@]}"
      - name: Upload write artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-write
          retention-days: 7
          path: |
            data/captures/write-*.json
            debug_super_write_*.png
            data/platform-mappings/
            data/platform-templates/super-parrain/
          if-no-files-found: ignore
      - name: Commit post-write golden if success
        if: success() && github.event.inputs.execute == 'true'
        run: |
          git config user.name "autofresh-bot"
          git config user.email "autofresh-bot@users.noreply.github.com"
          # Must match the state files activation_canary.yml commits: a real
          # WRITE_VERIFIED / cooldown update computed in-process (mark_write_verified,
          # record_super_action_now) is otherwise discarded when this ephemeral
          # runner exits, leaving the promotion invisible to every later workflow
          # run even though the live write genuinely happened (see incident on
          # run 31724917509 / Poulpeo: data/captures/write-super-parrain-poulpeo.json
          # proves post_match=true but platform-write-status.json never recorded it).
          # Same class of bug fixed elsewhere this session: a grouped `git add`
          # with `|| true` silently stages nothing at all the instant one
          # pathspec (e.g. data/captures/write-*.json when no matching file was
          # produced) doesn't exist. Stage each individually instead.
          for p in data/captures/write-*.json; do
            [ -e "$p" ] && git add "$p"
          done
          if [ -d data/platform-mappings ]; then git add data/platform-mappings; fi
          if [ -d data/platform-templates/super-parrain ]; then git add data/platform-templates/super-parrain; fi
          for p in data/platform-write-status.json \
                   data/autofresh-phase.json \
                   data/pending_writes.json \
                   data/super_parrain_jitter.json \
                   last_super_run.txt; do
            [ -f "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "No files to commit"
          else
            git commit -m "chore(write): Super-Parrain controlled write result for ${{ github.event.inputs.program }}"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "::error::git pull --rebase failed -- controlled write result was NOT pushed."
              exit 1
            fi
            if ! git push; then
              echo "::error::git push failed -- controlled write result was NOT pushed."
              exit 1
            fi
          fi

      - name: Save notification dedup state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/notifications/dedup.json
          key: autofresh-notify-dedup-${{ github.workflow }}-${{ github.run_id }}

      - name: Upload notification outbox for Hermes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofresh-notifications-controlled-write
          retention-days: 7
          if-no-files-found: ignore
          path: data/notifications/
