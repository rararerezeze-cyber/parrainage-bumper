name: Diagnose (Code-Parrainage offre save mechanism)
# READ-ONLY diagnostic, explicit operator authorization (2026-08-16). Real
# login + real navigation to /modif/84601 -- but structurally cannot click
# Enregistrer/Actualiser or submit anything (see
# tools/diagnose_code_parrainage_offre_save.py and
# tests/test_diagnose_code_parrainage_offre_save.py for the proof). Follows
# the GH run 31962858807 canary, whose 2 authorized Save clicks are NOT
# reused or repeated here.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: autofresh-diagnose-code-parrainage-offre-save
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Diagnose offre save mechanism (read-only, no save)
        env:
          CODE_PARRAINAGE_EMAIL: ${{ secrets.CODE_PARRAINAGE_EMAIL }}
          CODE_PARRAINAGE_PASSWORD: ${{ secrets.CODE_PARRAINAGE_PASSWORD }}
        run: |
          python -u tools/diagnose_code_parrainage_offre_save.py
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-code-parrainage-offre-save
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/captures/diagnose-code-parrainage-offre-save.json
            debug_diag_baseline.json
            debug_diag_reload1.json
            debug_diag_reload2.json
