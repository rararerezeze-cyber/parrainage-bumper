name = "autofresh-slack"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
GITHUB_REPO = "rararerezeze-cyber/parrainage-bumper"
GITHUB_REF = "main"

# KV namespace for short-TTL idempotency (Slack retries / double-clicks).
# Create once: wrangler kv namespace create IDEMPOTENCY
# then paste the returned id below.
[[kv_namespaces]]
binding = "IDEMPOTENCY"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets via: wrangler secret put SLACK_SIGNING_SECRET / GH_DISPATCH_TOKEN
# / SLACK_ALLOWED_USERS -- never commit values.
